name: Apply Code Patch

on:
  workflow_dispatch:
    inputs:
      patch_file:
        description: 'Patch file name (e.g. fix_bugs_v1.sh)'
        required: true
        default: 'fix_bugs_v1.sh'
        type: string
      commit_message:
        description: 'Commit message'
        required: true
        default: 'Apply patch from Claude'
        type: string

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "patch@kiranabook.app"
          git config user.name "Claude Patch Bot"

      - name: Run patch
        run: |
          chmod +x patches/${{ github.event.inputs.patch_file }}
          bash patches/${{ github.event.inputs.patch_file }}

      - name: Commit and push
        run: |
          git add -A
          git diff --staged --stat
          git commit -m "${{ github.event.inputs.commit_message }}" || echo "Nothing to commit"
          git push origin main
          echo "✅ Done!"
