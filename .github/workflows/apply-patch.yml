name: Apply Code Patch

on:
  workflow_dispatch:
    inputs:
      patch_content:
        description: 'Patch script content (base64 encoded)'
        required: true
        type: string
      commit_message:
        description: 'Commit message'
        required: true
        default: 'Apply patch from Claude'
        type: string

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "patch@kiranabook.app"
          git config user.name "Claude Patch Bot"

      - name: Apply patch
        run: |
          echo "${{ github.event.inputs.patch_content }}" | base64 -d > patch.sh
          chmod +x patch.sh
          bash patch.sh

      - name: Commit and push
        run: |
          git add -A
          git diff --staged --stat
          git commit -m "${{ github.event.inputs.commit_message }}" || echo "Nothing to commit"
          git push origin main
          echo "✅ Patch applied successfully!"
