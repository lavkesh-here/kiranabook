name: Build KiranaBook APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Show build folder
        run: |
          echo "=== Searching for APK ==="
          find $GITHUB_WORKSPACE -name "*.apk" 2>/dev/null || echo "No APK found"
          echo "=== Build folder ==="
          ls -la $GITHUB_WORKSPACE/build/app/outputs/ 2>/dev/null || echo "No build folder"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KiranaBook-APK
          path: |
            **/outputs/**/*.apk
          if-no-files-found: warn
          retention-days: 30
