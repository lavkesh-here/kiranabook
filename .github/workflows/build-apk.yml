name: Build KiranaBook APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter version check
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Verify APK exists
        run: |
          echo "=== Searching for APKs ==="
          find . -name "*.apk" -type f
          echo "=== Done ==="

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: KiranaBook-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload all APKs (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: KiranaBook-all-apks
          path: build/app/outputs/flutter-apk/
          if-no-files-found: warn
          retention-days: 30

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "KiranaBook Build #${{ github.run_number }}"
          body: |
            ## 📱 KiranaBook APK Ready!
            
            Download the right APK for your phone:
            - **app-arm64-v8a-release.apk** → Modern Android phones (2017+) ✅
            - **app-armeabi-v7a-release.apk** → Older Android phones
            
            **Install karo:**
            1. Download APK
            2. WhatsApp/Drive se phone pe bhejo
            3. Phone mein open karo
            4. "Allow from this source" → Install ✅
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
